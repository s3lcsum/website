{{ define "main" }}
<article class="sheet">
  <header class="sheet-head">
    <p class="kicker">Index</p>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="project-grid">
    {{ range .Pages }}
    <article class="project-card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</article>
{{ end }}
