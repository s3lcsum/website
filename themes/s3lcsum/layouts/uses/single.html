{{ define "main" }}
<article class="sheet">
  <header class="sheet-head">
    <p class="kicker">Setup</p>
    <h1>{{ .Title }}</h1>
  </header>

  <div class="sheet-grid">
    <div class="prose">
      {{ .Content }}
    </div>
    <aside class="facts">
      <section>
        <h2>Hardware</h2>
        <dl>
          <div><dt>Laptop</dt><dd>MacBook Pro M4 Max 14"</dd></div>
          <div><dt>Display</dt><dd>LG 27" 4K</dd></div>
          <div><dt>Mouse</dt><dd>Logitech MX Master 3</dd></div>
          <div><dt>Keyboard</dt><dd>Apple Magic Keyboard</dd></div>
          <div><dt>Desk</dt><dd>Standing desk 120×60</dd></div>
        </dl>
      </section>
      <section>
        <h2>Software</h2>
        <dl>
          <div><dt>OS</dt><dd>macOS / Linux</dd></div>
          <div><dt>Shell</dt><dd>zsh</dd></div>
          <div><dt>Editor</dt><dd>Neovim / VS Code</dd></div>
          <div><dt>Terminal</dt><dd>iTerm2 / Alacritty</dd></div>
        </dl>
      </section>
    </aside>
  </div>
</article>
{{ end }}
