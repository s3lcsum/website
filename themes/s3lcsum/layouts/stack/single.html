{{ define "main" }}
<article class="sheet">
  <header class="sheet-head">
    <p class="kicker">Toolkit</p>
    <h1>{{ .Title }}</h1>
    <p class="lede">What I reach for when something needs to stay up.</p>
  </header>

  <div class="stack-list">
    {{ range hugo.Data.stack }}
    <section class="stack-block">
      <h2>{{ .name }}</h2>
      <ul class="chip-row">
        {{ range .items }}
        <li>{{ . }}</li>
        {{ end }}
      </ul>
    </section>
    {{ end }}
  </div>
</article>
{{ end }}
